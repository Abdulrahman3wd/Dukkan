<main class="mx-auto max-w-3xl space-y-6 p-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-semibold">{{ 'demo.title' | transloco }}</h1>
    <div class="flex gap-2">
      <button (click)="toggleTheme()"
        class="rounded-md border border-line bg-surface px-3 py-1.5 hover:bg-surface-sub">
        {{ (dark() ? 'demo.light' : 'demo.dark') | transloco }}
      </button>
      <select (change)="onLang($event)" [value]="lang.current().code" aria-label="Language"
        class="rounded-md border border-line bg-surface px-3 py-1.5">
        @for (l of lang.languages; track l.code) {
          <option [value]="l.code" [selected]="l.code === lang.current().code">{{ l.nativeName }}</option>
        }
      </select>
    </div>
  </div>

  <section class="rounded-lg border border-line bg-surface p-5 shadow-raised">
    <p class="text-muted">{{ 'demo.lowStock' | transloco }}</p>

    <div class="mt-4 flex flex-wrap items-center gap-3">
      <button class="rounded-md bg-primary px-4 py-2 font-medium text-on-primary hover:bg-primary-hover">
        {{ 'demo.save' | transloco }}
      </button>
      <button class="rounded-md bg-danger-soft px-4 py-2 font-medium text-danger">
        {{ 'demo.delete' | transloco }}
      </button>
      <span class="rounded-full bg-success-soft px-3 py-1 text-xs font-medium text-success">
        {{ 'demo.completed' | transloco }}
      </span>
      <span class="rounded-full bg-warning-soft px-3 py-1 text-xs font-medium text-warning">
        {{ 'demo.low' | transloco }}
      </span>
    </div>

    <label class="mt-5 block text-sm font-medium" for="n">{{ 'demo.productName' | transloco }}</label>
    <input id="n" class="mt-1 w-full rounded-md border border-line bg-surface px-3 py-2"
      [value]="'demo.productValue' | transloco">

    <p class="mt-5">{{ 'demo.total' | transloco }}:
      <span class="ltr font-semibold">SAR 128,450</span></p>
  </section>
</main>
